name: HTML CI

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: ls -la

      - name: Validate HTML exists
        run: test -f index.html

      - name: Success message
        run: echo "HTML CI Passed"